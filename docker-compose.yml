services:
  aion2-event-announcer:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      FFMPEG_EXECUTABLE: ffmpeg
      HEALTHCHECK_PATH: /tmp/aion2-event-announcer-ready
      CONTROL_API_HOST: 0.0.0.0
      CONTROL_API_PORT: 8765
    ports:
      - "8765:8765"
    volumes:
      - ./config:/app/config
      - ./cache:/app/cache
